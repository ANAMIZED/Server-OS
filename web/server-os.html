<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0F1A">
<title>SERVER OS</title>
<style>body{margin:0;background:#0A0F1A;color:#7E8BA3;font:13px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;min-height:100vh}</style>
</head><body><div id="st">SERVER OS · loading…</div>
<script>
(async function(){
  const st=document.getElementById("st");
  try {
    const [a,b]=await Promise.all([
      fetch("sos-data-1.txt").then(r=>r.text()),
      fetch("sos-data-2.txt").then(r=>r.text())
    ]);
    const bin=Uint8Array.from(atob(a+b),c=>c.charCodeAt(0));
    const stream=new Response(bin).body.pipeThrough(new DecompressionStream("gzip"));
    const text=await new Response(stream).text();
    location.replace(URL.createObjectURL(new Blob([text],{type:"text/html;charset=utf-8"})));
  } catch(e) {
    st.textContent="Load failed: "+e+". Serve the web/ folder over HTTP (python -m http.server)."
  }
})();
</script></body></html>
